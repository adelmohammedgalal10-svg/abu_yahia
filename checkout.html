<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو يحيى - إتمام الطلب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="checkout-page">
    <header>
        <div class="header-content">
            <img src="img/photo_2026-10-13_22-49-43.jpg" alt="لوجو أبو يحيى" class="header-logo">
            <h1>إتمام الطلب</h1>
        </div>
    </header>

    <main class="checkout-container">
        <div class="order-summary">
            <h3>ملخص الطلب 🛒</h3>
            <div id="cartItemsList"></div>
            <hr>
            <div class="delivery-fee">رسوم التوصيل: <strong>السعر حسب المكان</strong></div>
            <h3 class="final-total">إجمالي الأكل: <span id="finalPrice">0</span> جنيه</h3>
        </div>

        <div class="checkout-form">
            <h3>تحديد موقعك 📍</h3>
            
            <div class="form-group">
                <button type="button" onclick="getLocation()" class="btn-secondary" id="locationBtn">📍 حدد موقعي الحالي (GPS)</button>
                <p id="locationStatus" class="location-status"></p>
            </div>

            <div class="form-group">
                <input type="text" id="address" placeholder="اكتب العنوان يدوياً (الشارع، العمارة، الدور)..." required>
            </div>
            
            <div class="form-group">
                <input type="tel" id="extraPhone" placeholder="رقم تواصل إضافي (اختياري)">
            </div>

            <h3>اختر طريقة الدفع 💳</h3>
            <div class="payment-methods">
                <label class="payment-option">
                    <input type="radio" name="payment" value="الدفع عند الاستلام" checked>
                    <span>الدفع عند الاستلام</span>
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="فودافون كاش">
                    <img src="img/c7dd392b612d4b38d0856a3ce3dff815.jpg" alt="فودافون كاش">
                </label>
                <label class="payment-option">
                    <input type="radio" name="payment" value="إنستا باي">
                    <img src="img/8b129cbf86c91945e7dce9add728ef3c.jpg" alt="إنستا باي">
                </label>
            </div>

            <button onclick="confirmOrder()" class="btn-primary btn-whatsapp">تأكيد الطلب (واتساب)</button>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        window.onload = renderCheckout;
    </script>
</body>
</html>
